name: analyze
on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.2.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Prettier Check
        run: npx prettier --check .

      - name: Run linter
        run: npm run lint
        env:
          CI: true

      - name: Run Tests
        run: cd npm run test
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true
