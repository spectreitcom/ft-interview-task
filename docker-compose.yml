version: '3.9'
services:
  db:
    image: postgres:14.2-alpine
    container_name: db
    environment:
      POSTGRES_DB: future_mind_db
      POSTGRES_USER: future_mind_db
      POSTGRES_PASSWORD: future_mind_db
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7.0-alpine
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
